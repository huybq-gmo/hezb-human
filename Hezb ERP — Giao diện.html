<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hezb ERP — Giao diện</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F6F7FB;
      --sf: #fff;
      --ink: #0F172A;
      --mut: #64748B;
      --ln: #E2E8F0;
      --pri: #4F46E5;
      --pri-s: #EEF0FF;
      --cy: #22D3EE;
      --ok: #059669;
      --ok-s: #E3F7EF;
      --wn: #B45309;
      --wn-s: #FEF3E2;
      --er: #DC2626;
      --er-s: #FDE8E8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0B1020;
        --sf: #131A2E;
        --ink: #E8ECF6;
        --mut: #8D99B3;
        --ln: #243049;
        --pri: #8B85FF;
        --pri-s: #1E2250;
        --ok: #34D399;
        --ok-s: #0F2F27;
        --wn: #FBBF24;
        --wn-s: #33260E;
        --er: #F87171;
        --er-s: #3A1616
      }
    }

    :root[data-theme="dark"] {
      --bg: #0B1020;
      --sf: #131A2E;
      --ink: #E8ECF6;
      --mut: #8D99B3;
      --ln: #243049;
      --pri: #8B85FF;
      --pri-s: #1E2250;
      --ok: #34D399;
      --ok-s: #0F2F27;
      --wn: #FBBF24;
      --wn-s: #33260E;
      --er: #F87171;
      --er-s: #3A1616
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font: 14px/1.5 "Be Vietnam Pro", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink)
    }

    button {
      font: inherit;
      cursor: pointer;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--pri);
      outline-offset: 2px
    }

    .hide {
      display: none !important
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    /* login */
    #login {
      min-height: 100%;
      display: grid;
      grid-template-columns: 1.1fr 1fr
    }

    .lg-l {
      background: #0F172A;
      color: #fff;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden
    }

    .lg-l h1 {
      font-size: 34px;
      line-height: 1.2;
      max-width: 15em;
      font-weight: 600;
      position: relative
    }

    .lg-l p {
      color: #94A3B8;
      max-width: 26em;
      margin-top: 12px;
      position: relative
    }

    .lg-l svg.bg {
      position: absolute;
      right: -90px;
      bottom: -110px;
      width: 420px;
      opacity: .9
    }

    .lg-r {
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--sf)
    }

    .lg-r form {
      width: 100%;
      max-width: 340px;
      display: grid;
      gap: 14px
    }

    .lg-r h2 {
      font-size: 22px
    }

    label {
      display: grid;
      gap: 4px;
      font-weight: 500;
      font-size: 13px
    }

    input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink)
    }

    .btn {
      background: var(--pri);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 13px
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ln)
    }

    .btn.bad {
      background: transparent;
      color: var(--er);
      border: 1px solid var(--er)
    }

    .lnk {
      background: none;
      border: 0;
      color: var(--pri);
      padding: 0;
      font-size: 13px
    }

    /* app */
    #app {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100%
    }

    aside {
      background: var(--sf);
      border-right: 1px solid var(--ln);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh
    }

    aside .logo {
      padding: 2px 8px 18px
    }

    .nv {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 0;
      background: none;
      text-align: left;
      width: 100%;
      color: var(--mut);
      font-weight: 500;
      position: relative
    }

    .nv:hover {
      background: var(--bg)
    }

    .nv.on {
      background: var(--pri-s);
      color: var(--pri);
      font-weight: 600
    }

    .nv.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--cy)
    }

    .nv svg {
      width: 18px;
      height: 18px;
      flex: none
    }

    .grp {
      font-size: 12px;
      color: var(--mut);
      padding: 14px 10px 4px
    }

    .me {
      margin-top: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-top: 1px solid var(--ln)
    }

    .me small {
      display: block;
      color: var(--mut);
      font-size: 12px
    }

    main {
      min-width: 0
    }

    .top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--ln);
      background: var(--sf);
      position: sticky;
      top: 0;
      z-index: 2
    }

    .top h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1
    }

    .top input {
      width: 220px
    }

    .ib {
      border: 1px solid var(--ln);
      background: var(--sf);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      position: relative
    }

    .ib i {
      position: absolute;
      top: 6px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cy);
      border: 2px solid var(--sf)
    }

    .pg {
      padding: 24px 28px 40px;
      display: grid;
      gap: 20px
    }

    .hx {
      width: 34px;
      height: 38px;
      flex: none;
      background: var(--pri);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      display: grid;
      place-items: center;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%)
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 12px
    }

    .card>h3,
    .ch {
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid var(--ln);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .bd {
      padding: 16px 18px
    }

    .strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr)
    }

    .strip>div {
      padding: 16px 18px;
      border-right: 1px solid var(--ln)
    }

    .strip>div:last-child {
      border: 0
    }

    .strip b {
      display: block;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2
    }

    .strip span {
      color: var(--mut);
      font-size: 13px
    }

    .strip em {
      font-style: normal;
      font-size: 12px;
      color: var(--ok)
    }

    .two {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px
    }

    .bar {
      display: grid;
      grid-template-columns: 120px 1fr 48px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px
    }

    .bar div.t {
      height: 8px;
      border-radius: 4px;
      background: var(--bg);
      overflow: hidden
    }

    .bar div.t i {
      display: block;
      height: 100%;
      background: var(--pri);
      border-radius: 4px
    }

    .bar.hi div.t i {
      background: var(--er)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-weight: 500;
      color: var(--mut);
      font-size: 13px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--ln)
    }

    td {
      padding: 11px 18px;
      border-bottom: 1px solid var(--ln);
      vertical-align: middle
    }

    tr:last-child td {
      border: 0
    }

    .who {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .who small {
      display: block;
      color: var(--mut);
      font-size: 12px
    }

    .chip {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg);
      color: var(--mut)
    }

    .chip.ok {
      background: var(--ok-s);
      color: var(--ok)
    }

    .chip.wn {
      background: var(--wn-s);
      color: var(--wn)
    }

    .chip.er {
      background: var(--er-s);
      color: var(--er)
    }

    .chip.pr {
      background: var(--pri-s);
      color: var(--pri)
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .f {
      border: 1px solid var(--ln);
      background: var(--sf);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 13px
    }

    .f.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .lock {
      color: var(--mut);
      font-size: 13px
    }

    .ov {
      overflow-x: auto
    }

    /* board */
    .cols {
      display: grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      gap: 14px;
      overflow-x: auto
    }

    .col {
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 10px;
      align-content: start
    }

    .col h4 {
      font-size: 13px;
      font-weight: 600;
      padding: 2px 4px;
      display: flex;
      justify-content: space-between
    }

    .col h4 span {
      color: var(--mut);
      font-weight: 500
    }

    .is {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      gap: 8px
    }

    .is p {
      font-weight: 500
    }

    .is .m {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--mut);
      font-size: 12px
    }

    .k {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .k i {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--pri)
    }

    .k i.bug {
      background: var(--er)
    }

    .k i.story {
      background: var(--ok)
    }

    .is .hx {
      width: 24px;
      height: 27px;
      font-size: 10px
    }

    .sp {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap
    }

    .pb {
      flex: 1;
      min-width: 140px;
      height: 8px;
      border-radius: 4px;
      background: var(--ln);
      overflow: hidden
    }

    .pb i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--pri), var(--cy))
    }

    /* timesheet */
    .step {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 12px;
      color: var(--mut)
    }

    .step b {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500
    }

    .step b:before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--ln)
    }

    .step b.d {
      color: var(--ink)
    }

    .step b.d:before {
      background: var(--pri);
      border-color: var(--pri)
    }

    .step b.c:before {
      border-color: var(--cy);
      background: var(--cy)
    }

    .step s {
      width: 18px;
      height: 2px;
      background: var(--ln);
      margin: 0 6px
    }

    .step s.d {
      background: var(--pri)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    #toast.on {
      opacity: 1
    }

    .tk {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 20px;
      align-items: start
    }

    .tl2 {
      position: relative;
      display: grid;
      gap: 16px
    }

    .tl2:before {
      content: "";
      position: absolute;
      left: 16px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--ln)
    }

    .cm {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      position: relative
    }

    .cb {
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--sf);
      overflow: hidden
    }

    .cb header {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--ln);
      font-size: 13px;
      color: var(--mut)
    }

    .cb header b {
      color: var(--ink)
    }

    .cb .tx {
      padding: 12px 14px
    }

    .cb ul {
      margin: 6px 0 0 18px
    }

    .cb footer {
      padding: 0 14px 10px;
      display: flex;
      gap: 6px
    }

    .ev {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: 8px;
      font-size: 13px;
      color: var(--mut);
      position: relative
    }

    .ev i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--sf);
      border: 2px solid var(--ln);
      flex: none
    }

    .ev.l i {
      border-color: var(--cy)
    }

    code {
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12px;
      border: 1px solid var(--ln)
    }

    .mt {
      color: var(--pri);
      font-weight: 500
    }

    textarea {
      font: inherit;
      width: 100%;
      min-height: 90px;
      padding: 10px 12px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      resize: vertical
    }

    select {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink)
    }

    .kv {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 12px 8px;
      padding: 16px 18px;
      font-size: 13px
    }

    .kv dt {
      color: var(--mut)
    }

    .kv dd {
      margin: 0
    }

    input.ti {
      width: 56px;
      text-align: center;
      padding: 6px 0;
      border-radius: 6px;
      background: var(--sf)
    }

    .gr td {
      background: var(--bg);
      font-weight: 600
    }

    .tdy {
      background: var(--pri-s)
    }

    .mdl {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .5);
      display: grid;
      place-items: center;
      z-index: 5;
      padding: 16px
    }

    .mdl form {
      background: var(--sf);
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 440px;
      display: grid;
      gap: 12px
    }

    tr.cl {
      cursor: pointer
    }

    tr.cl:hover td {
      background: var(--bg)
    }

    @media(max-width:860px) {
      .tk {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:860px) {
      #login {
        grid-template-columns: 1fr
      }

      .lg-l {
        display: none
      }

      #app {
        grid-template-columns: 1fr
      }

      aside {
        position: static;
        height: auto;
        flex-direction: row;
        overflow-x: auto;
        padding: 10px;
        border: 0;
        border-bottom: 1px solid var(--ln)
      }

      aside .logo,
      .grp,
      .me {
        display: none
      }

      .nv {
        width: auto;
        white-space: nowrap
      }

      .nv.on:before {
        display: none
      }

      .top,
      .pg {
        padding-left: 16px;
        padding-right: 16px
      }

      .top input {
        display: none
      }

      .strip {
        grid-template-columns: 1fr 1fr
      }

      .two {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="mk" viewBox="-66 -76 132 152">
        <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36" fill="#4F46E5" />
        <rect x="-22" y="-30" width="12" height="60" rx="2" fill="#fff" />
        <rect x="10" y="-30" width="12" height="60" rx="2" fill="#fff" />
        <polygon points="-10,18 -10,6 10,-18 10,-6" fill="#22D3EE" />
      </symbol>
    </defs>
  </svg>

  <section id="login">
    <div class="lg-l">
      <div style="display:flex;align-items:center;gap:10px;position:relative"><svg width="34" height="38">
          <use href="#mk" />
        </svg><b style="font-size:24px">Hezb</b></div>
      <div>
        <h1>Từ giờ làm việc đến bảng lương, một luồng duy nhất.</h1>
        <p>Nhân sự, dự án, chấm công và thanh toán của công ty — có phân quyền và nhật ký kiểm toán cho mọi bước duyệt.
        </p>
      </div>
      <svg class="bg" viewBox="-66 -76 132 152">
        <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36" fill="#4F46E5" />
        <rect x="-22" y="-30" width="12" height="60" rx="2" fill="#fff" />
        <rect x="10" y="-30" width="12" height="60" rx="2" fill="#fff" />
        <polygon points="-10,18 -10,6 10,-18 10,-6" fill="#22D3EE" />
      </svg>
    </div>
    <div class="lg-r">
      <form id="lf">
        <h2>Đăng nhập</h2>
        <label>Email công ty<input type="email" value="minh.tran@hezb.vn" required></label>
        <label>Mật khẩu<input type="password" value="password" required></label>
        <button class="btn" type="submit">Đăng nhập</button>
        <button class="lnk" type="button" onclick="toast('Đã gửi magic link tới email của bạn')">Gửi magic link qua
          email</button>
      </form>
    </div>
  </section>

  <div id="app" class="hide">
    <aside id="nav"></aside>
    <main>
      <header class="top">
        <h1 id="ttl"></h1><input placeholder="Tìm nhân sự, dự án, issue…" aria-label="Tìm kiếm">
        <button class="btn sm" onclick="openLog()">+ Log work</button>
        <button class="ib" aria-label="Thông báo" onclick="toast('Timesheet của Lan Phạm đang chờ bạn duyệt')"><svg
            width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0" />
          </svg><i></i></button>
        <button class="ib" aria-label="Đổi giao diện" onclick="th()"><svg width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z" />
          </svg></button>
      </header>
      <div id="pg" class="pg"></div>
    </main>
  </div>
  <div id="md" class="hide"></div>
  <div id="toast" role="status"></div>

  <script>
    const $ = s => document.querySelector(s);
    const ini = n => n.split(' ').slice(-2).map(w => w[0]).join('');
    const hx = n => `<span class="hx">${ini(n)}</span>`;
    const who = (n, s) => `<div class="who">${hx(n)}<div>${n}<small>${s}</small></div></div>`;
    const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
